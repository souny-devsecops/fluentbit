# ตัวอย่างบล็อกที่ต้องใส่ใน service ของแอป (เช่น ithq-kkl-pubnub-bun)
# เพื่อไม่ให้ Docker เก็บ log ใน /var/lib/docker/containers/*-json.log
#
# ใช้คู่กับ fluent-bit ที่ listen 127.0.0.1:24224 บน host นี้
#
# logging:
#   driver: fluentd
#   options:
#     fluentd-address: "127.0.0.1:24224"
#     fluentd-async: "true"
#     tag: "docker.{{.Name}}"

services:
  ithq-kkl-pubnub-bun:
    image: kolaogroup/ithq-kkl-pubnub-bun:1.0.0
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"
