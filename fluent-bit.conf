[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     warning
    Parsers_File  parsers.conf

# อ่าน log จากไฟล์บน host (เช่น /etc/docker/logs/81f96ffa78df.log)
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /etc/docker/logs/*.log
    Path_Key          filepath
    DB                /fluent-bit/state/tail.db
    Parser            docker_line
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Rotate_Wait       5

# ดึงชื่อจากชื่อไฟล์ → ใช้ทำ index เช่น fluentbit-81f96ffa78df
[FILTER]
    Name    lua
    Match   *
    script  /fluent-bit/etc/strip.lua
    call    from_log_path

# ถ้า field log เป็น JSON จะ flatten เข้า record
[FILTER]
    Name          parser
    Match         *
    Key_Name      log
    Parser        docker_json
    Reserve_Data  On
    Preserve_Key  Off

[OUTPUT]
    Name                es
    Match               *
    Host                ${ES_HOST}
    Port                ${ES_PORT}
    HTTP_User           ${ES_USER}
    HTTP_Passwd         ${ES_PASSWORD}
    # ตัวอย่าง index: fluentbit-81f96ffa78df
    # ใน Kibana ใช้ Index pattern: fluentbit-*
    Index               fluentbit-$container_name
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         5
    Trace_Error         On
