[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     warning
    Parsers_File  parsers.conf

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

# Docker fluentd driver ส่ง container_name แบบ "/name" — ตัด / ก่อนใช้เป็น index
[FILTER]
    Name    lua
    Match   *
    script  /fluent-bit/etc/strip.lua
    call    strip_container_slash

# ถ้า log เป็น JSON จะ flatten เข้า record (คล้าย decode_json_fields ของ Filebeat)
[FILTER]
    Name          parser
    Match         *
    Key_Name      log
    Parser        docker_json
    Reserve_Data  On
    Preserve_Key  Off

[OUTPUT]
    Name                es
    Match               *
    Host                ${ES_HOST}
    Port                ${ES_PORT}
    HTTP_User           ${ES_USER}
    HTTP_Passwd         ${ES_PASSWORD}
    Index               $container_name
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         5
    Trace_Error         On
